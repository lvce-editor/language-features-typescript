name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - name: Test official TS7 WASM against project and dependency changes
        run: node --test scripts/test-ts7-wasm.mjs
      - name: Test shared synchronous response transport
        run: node --test scripts/test-shared-sync-rpc.mjs
      - run: npm run build
      - name: Verify extension archive
        run: node scripts/test-extension-archive.mjs
      - run: npm run build:static
      - name: Install Chromium
        working-directory: packages/e2e
        run: npx playwright install chromium
      - name: Install browser system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/e2e
        run: npx playwright install-deps chromium
      - name: Test actual Pages artifact without cross-origin isolation
        run: node scripts/test-ts7-static.mjs
      - name: Test symbols and signature help without cross-origin isolation
        env:
          TS_WEB_TEST: typescript.symbols
        run: node scripts/test-ts7-static.mjs
      - name: Test quick fixes without cross-origin isolation
        env:
          TS_WEB_TEST: typescript.quick-fix-web
        run: node scripts/test-ts7-static.mjs
      - name: Test TypeScript language features in the editor
        run: node packages/build/src/run-e2e.ts ts7-e2e --headless --trace-renderer-worker
      - uses: actions/upload-pages-artifact@v5
        if: runner.os == 'Linux'
        with:
          path: dist
  deploy:
    needs: ci
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  # Temporary differential probe for the Ubuntu-only cold WebKit failure.
  webkit-comparison:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Restore baseline implementation while retaining diagnostic capture
        if: matrix.variant == 'baseline'
        run: >-
          git restore --source=0f3ebaa77ad6afba6d32fbeca40d48f63bbfcab7 --
          packages/extension/src/parts/Command/Command.ts
          packages/extension/src/parts/FileCacheApi/FileCacheApi.ts
          packages/typescript-worker/src/parts/CachedFileClient/CachedFileClient.ts
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm run build:static
        env:
          PATH_PREFIX: auto
      - name: Install browsers
        working-directory: ./packages/e2e
        run: npx playwright install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Match full-job browser preconditions
        shell: bash
        run: |
          node scripts/benchmark-file-cache.mjs
          npm run e2e:headless --workspace=packages/e2e -- --trace-renderer-worker
          npm run e2e:firefox:headless --workspace=packages/e2e -- --trace-renderer-worker
          npm run e2e:webkit:headless
          node packages/build/src/run-e2e.ts threejs-e2e --headless --timeout=60000 --trace-renderer-worker
          node packages/build/src/run-e2e.ts threejs-e2e --headless --browser=firefox --timeout=60000 --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Compare cold and warm Three.js diagnostics
        run: node packages/build/src/run-e2e.ts threejs-e2e --headless --browser=webkit --no-reuse-page --timeout=60000
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run type-check
      - run: npm test
      - name: Test shared synchronous response transport
        run: node --test scripts/test-shared-sync-rpc.mjs
      - name: Test Three.js repeated edits
        run: node scripts/benchmark-threejs.mjs
        env:
          THREEJS_ENFORCE_REUSE: 1
      - name: Build
        run: npm run build
      - name: Build static site
        run: npm run build:static
        env:
          PATH_PREFIX: auto
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: install playwright system dependencies
        working-directory: ./packages/e2e
        run: sudo npx playwright install-deps chromium firefox webkit
        if: runner.os == 'Linux'
      - name: Test persistent file cache and measure diagnostics
        run: node scripts/benchmark-file-cache.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run headless test
        run: npm run e2e:headless --workspace=packages/e2e -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run Firefox headless tests
        run: npm run e2e:firefox:headless --workspace=packages/e2e -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run WebKit headless tests
        # Windows WebKit lacks OffscreenCanvas, which the editor requires.
        if: runner.os != 'Windows'
        run: npm run e2e:webkit:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      # Loading the real declaration fixture emits hundreds of file notifications.
      # Windows Firefox setup alone took 28.5s; keep the usual suite at 30s and
      # give this large-fixture scenario its own bounded setup/analysis allowance.
      - name: Run Three.js Chromium regression
        run: node packages/build/src/run-e2e.ts threejs-e2e --headless --timeout=60000 --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run Three.js Firefox regression
        run: node packages/build/src/run-e2e.ts threejs-e2e --headless --browser=firefox --timeout=60000 --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run Three.js WebKit regression
        if: runner.os != 'Windows'
        run: node packages/build/src/run-e2e.ts threejs-e2e --headless --browser=webkit --no-reuse-page --timeout=60000
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run smart selection headless tests
        run: npm run e2e:smart-selection
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run smart selection Firefox headless tests
        run: npm run e2e:smart-selection:firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run smart selection WebKit headless tests
        # Windows WebKit lacks OffscreenCanvas, which the editor requires.
        if: runner.os != 'Windows'
        run: npm run e2e:smart-selection:webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run Firefox performance trace regression
        if: matrix.os == 'ubuntu-24.04'
        run: node packages/build/src/run-e2e.ts stable-e2e --headless --browser=firefox --filter=typescript.performance-trace
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload failing test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-worker-traces-${{ matrix.os }}
          path: '**/renderer-worker-traces/**'
          include-hidden-files: true

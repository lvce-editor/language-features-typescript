name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run type-check
      - run: npm test
      - name: Test shared synchronous response transport
        run: node --test scripts/test-shared-sync-rpc.mjs
      - name: Build
        run: npm run build
      - name: Build static site
        run: npm run build:static
        env:
          PATH_PREFIX: auto
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: install playwright system dependencies
        working-directory: ./packages/e2e
        run: sudo npx playwright install-deps chromium firefox webkit
        if: runner.os == 'Linux'
      - name: Test persistent file cache and measure diagnostics
        run: node scripts/benchmark-file-cache.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run headless test
        run: npm run e2e:headless --workspace=packages/e2e -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run Firefox headless tests
        run: npm run e2e:firefox:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run WebKit headless tests
        # Windows WebKit lacks OffscreenCanvas, which the editor requires.
        if: runner.os != 'Windows'
        run: npm run e2e:webkit:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run smart selection headless tests
        run: npm run e2e:smart-selection
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run smart selection Firefox headless tests
        run: npm run e2e:smart-selection:firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run smart selection WebKit headless tests
        # Windows WebKit lacks OffscreenCanvas, which the editor requires.
        if: runner.os != 'Windows'
        run: npm run e2e:smart-selection:webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run Firefox performance trace regression
        if: matrix.os == 'ubuntu-24.04'
        run: node packages/build/src/run-e2e.ts stable-e2e --headless --browser=firefox --filter=typescript.performance-trace
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload failing test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-worker-traces-${{ matrix.os }}
          path: '**/renderer-worker-traces/**'
          include-hidden-files: true

name: PR

on:
  pull_request:
    branches: [main]

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - name: Test official TS7 WASM against project and dependency changes
        run: node --test scripts/test-ts7-wasm.mjs
      - name: Test shared synchronous response transport
        run: node --test scripts/test-shared-sync-rpc.mjs
      - run: npm run build
      - name: Verify extension archive
        run: node scripts/test-extension-archive.mjs
      - run: npm run build:static
      - name: Install browsers
        working-directory: packages/e2e
        run: npx playwright install chromium firefox webkit
      - name: Install browser system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/e2e
        run: npx playwright install-deps chromium firefox webkit
      - name: Test Firefox rename without cross-origin isolation
        run: node scripts/test-static-rename.mjs
      - name: Test WebKit rename without cross-origin isolation
        if: runner.os != 'Windows'
        run: node scripts/test-static-rename.mjs
        env:
          RENAME_BROWSER: webkit
      - name: Test actual Pages artifact without cross-origin isolation
        run: node scripts/test-ts7-static.mjs
      - name: Test hoisted package completion on Windows
        if: runner.os == 'Windows'
        run: node packages/build/src/run-e2e.ts ts7-e2e --filter=typescript.completion-from-node-modules-monorepo --headless --trace-renderer-worker
      - name: Test symbols and signature help without cross-origin isolation
        env:
          TS_WEB_TEST: typescript.symbols
        run: node scripts/test-ts7-static.mjs
      - name: Test quick fixes without cross-origin isolation
        env:
          TS_WEB_TEST: typescript.quick-fix-web
        run: node scripts/test-ts7-static.mjs
      - name: Test TypeScript language features in the editor
        run: node packages/build/src/run-e2e.ts ts7-e2e --headless --trace-renderer-worker
      - name: Test Firefox language features
        run: node packages/build/src/run-e2e.ts ts7-e2e --browser=firefox --headless --trace-renderer-worker
      - name: Test WebKit language features
        if: runner.os != 'Windows'
        run: node packages/build/src/run-e2e.ts ts7-e2e --browser=webkit --headless --no-reuse-page
      # TS7 creates fresh snapshots for all six analyses; measured WebKit total is 70s.
      # Keep the per-RPC deadline at 30s and bound this cumulative UI scenario separately.
      - name: Test Three.js Chromium graph
        run: node packages/build/src/run-e2e.ts threejs-e2e --headless --timeout=120000 --trace-renderer-worker
      - name: Test Three.js Firefox graph
        run: node packages/build/src/run-e2e.ts threejs-e2e --browser=firefox --headless --timeout=120000 --trace-renderer-worker
      - name: Test Three.js WebKit graph
        if: runner.os != 'Windows'
        run: node packages/build/src/run-e2e.ts threejs-e2e --browser=webkit --headless --no-reuse-page --timeout=120000
      - name: Prepare native TypeScript test host
        run: node scripts/prepare-native-test-host.mjs
      - name: Run native TypeScript regression
        run: npm run e2e:native --workspace=packages/e2e -- --trace-renderer-worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ts7-results-${{ matrix.os }}
          path: |
            .tmp/ts7-results/
            .tmp/static-rename/
            **/renderer-worker-traces/**
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && success()
        with:
          name: ts7-pages-preview
          path: dist
